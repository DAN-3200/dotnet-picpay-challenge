name: Pipeline de CI - .NET

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependências
        run: dotnet restore PicPay.slnx

      - name: Compilar código
        run: dotnet build PicPay.slnx --no-restore --configuration Release

      - name: Rodar testes
        run: dotnet test PicPay.slnx --no-build --configuration Release

  build-and-push:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' # Evita push em Pull Requests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.ACTOR }}
          password: ${{ secrets.PAT }}

      - name: Build e Push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ghcr.io/${{ github.REPOSITORY }}:latest